<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP - Tienda de Aromas | Catálogo Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-x-hidden">

    <!-- Navbar Principal -->
    <header class="bg-black text-white sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <!-- Botón Hambuguesa (Solo visible en móviles) -->
            <button id="btn-abrir-menu" class="md:hidden text-white focus:outline-none p-1 hover:bg-gray-900 rounded">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="flex items-center space-x-2">
                <span class="text-3xl font-black tracking-tighter">ap®</span>
                <span class="text-xs uppercase tracking-widest border-l border-gray-600 pl-2">Tienda de Aromas</span>
            </div>
        </div>
        <p class="text-sm italic text-gray-400 hidden sm:block">"Con aromas es mejor"</p>
    </header>

    <!-- Contenedor de la App -->
    <div class="max-w-7xl mx-auto flex min-h-screen relative">
        
        <!-- Fondo oscuro cuando el menú móvil está abierto -->
        <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>
        
        <!-- Sidebar de Filtros (Desplegable en móvil, fijo en escritorio) -->
        <aside id="sidebar-menu" class="fixed md:sticky top-[68px] left-0 h-[calc(100vh-68px)] w-72 md:w-64 bg-white p-6 border-r border-gray-200 z-50 
            -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
            
            <!-- Encabezado del menú interno en móviles para poder cerrarlo -->
            <div class="flex justify-between items-center mb-6 md:hidden">
                <h3 class="font-bold uppercase tracking-wider text-gray-500 text-sm">Categorías</h3>
                <button id="btn-cerrar-menu" class="text-gray-500 hover:text-black p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <h2 class="text-lg font-bold mb-4 uppercase tracking-wider text-gray-900 hidden md:block">Secciones</h2>
            <nav class="flex flex-col gap-2" id="contenedor-filtros">
                <button data-cat="todos" class="btn-filtro active w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-2">✨ Todos los Productos</button>
                <button data-cat="textiles" class="btn-filtro w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-2">🧥 Perfumes Textiles</button>
                <button data-cat="difusores" class="btn-filtro w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-2">🌿 Difusores de Aromas</button>
                <button data-cat="cosmetica" class="btn-filtro w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-2">🧴 Cosmética y Cuidado</button>
                <button data-cat="auto" class="btn-filtro w-full text-left px-4 py-3 rounded-lg font-medium transition flex items-center gap-2">🚗 Línea Auto</button>
            </nav>
        </aside>

        <!-- Grilla de Exhibición de Productos -->
        <main class="flex-1 p-6 md:p-10 w-full">
            <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
                <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900" id="titulo-seccion">Todos los Productos</h1>
                <span class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold" id="contador-productos">0 ítems</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="grilla-productos">
                <!-- Render dinámico -->
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
