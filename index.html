<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP - Tienda de Aromas | Catálogo Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-x-hidden">

    <!-- Navbar Principal -->
    <header class="bg-black text-white sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-4">
            <!-- Botón Hamburguesa Móvil (Corregido a text-white para que sea visible) -->
            <button id="btn-abrir-menu" class="md:hidden text-white focus:outline-none p-1 hover:bg-gray-900 rounded">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="ap tienda de aromas" class="h-10 w-auto object-contain">
                <!-- Nombre Estilizado (Corregido: text-white y visibilidad móvil opcional) -->
                <span class="brand-subtitle text-base border-l border-white/30 pl-3 text-white">Dana Romano</span>
            </div>
        </div>
        <p class="brand-slogan text-xs tracking-wider uppercase text-gray-400 hidden sm:block">"Con aromas es mejor"</p>
    </header>

    <!-- Contenedor de la App -->
    <div class="max-w-7xl mx-auto flex min-h-screen relative">
        
        <!-- Fondo oscuro menú móvil -->
        <div id="menu-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>
        
        <!-- Sidebar de Filtros -->
        <aside id="sidebar-menu" class="fixed md:sticky top-[73px] left-0 h-[calc(100vh-73px)] w-72 md:w-64 bg-white p-6 border-r border-gray-100 z-50 
            -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
            
            <div class="flex justify-between items-center mb-6 md:hidden">
                <h3 class="font-bold uppercase tracking-wider text-gray-400 text-xs">Categorías</h3>
                <button id="btn-cerrar-menu" class="text-gray-400 hover:text-black p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <h2 class="text-xs font-bold mb-4 uppercase tracking-widest text-gray-400 hidden md:block">Secciones</h2>
            <nav class="flex flex-col gap-1.5" id="contenedor-filtros">
                <button data-cat="ofertas" class="btn-filtro w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2 text-red-600 hover:bg-red-50">🔥 Ofertas</button>
                <button data-cat="todos" class="btn-filtro active w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">✨ Todos los Productos</button>
                <button data-cat="textiles" class="btn-filtro w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">🧥 Perfumes Textiles</button>
                <button data-cat="difusores" class="btn-filtro w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">🌿 Difusores de Aromas</button>
                <button data-cat="cosmetica" class="btn-filtro w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">🧴 Cosmética y Cuidado</button>
                <button data-cat="auto" class="btn-filtro w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">🚗 Línea Auto</button>
            </nav>
        </aside>

        <!-- Grilla de Exhibición -->
        <main class="flex-1 p-6 md:p-10 w-full">
            <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-4">
                <h1 class="text-xl md:text-2xl font-bold text-gray-900 tracking-tight" id="titulo-seccion">Todos los Productos</h1>
                <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium" id="contador-productos">0 ítems</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="grilla-productos">
                <!-- Se rellena con JS -->
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
