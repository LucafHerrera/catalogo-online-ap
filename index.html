<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP - Tienda de Aromas | Catálogo Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-black text-white sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-3xl font-black tracking-tighter">ap®</span>
            <span class="text-xs uppercase tracking-widest border-l border-gray-600 pl-2">Tienda de Aromas</span>
        </div>
        <p class="text-sm italic text-gray-400 hidden sm:block">"Con aromas es mejor"</p>
    </header>

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row min-h-screen">
        
        <aside class="w-full md:w-64 bg-white p-6 border-b md:border-r border-gray-200">
            <h2 class="text-lg font-bold mb-4 uppercase tracking-wider text-gray-900">Secciones</h2>
            <nav class="flex flex-wrap md:flex-col gap-2" id="contenedor-filtros">
                <button data-cat="todos" class="btn-filtro active w-full text-left px-4 py-2 rounded-lg font-medium transition">✨ Todos los Productos</button>
                <button data-cat="textiles" class="btn-filtro w-full text-left px-4 py-2 rounded-lg font-medium transition">🧥 Perfumes Textiles</button>
                <button data-cat="difusores" class="btn-filtro w-full text-left px-4 py-2 rounded-lg font-medium transition">🌿 Difusores de Aromas</button>
                <button data-cat="cosmetica" class="btn-filtro w-full text-left px-4 py-2 rounded-lg font-medium transition">🧴 Cosmética y Cuidado</button>
                <button data-cat="auto" class="btn-filtro w-full text-left px-4 py-2 rounded-lg font-medium transition">🚗 Línea Auto</button>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
                <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900" id="titulo-seccion">Todos los Productos</h1>
                <span class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold" id="contador-productos">0 ítems</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="grilla-productos">
                </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
